name: Build CodeStudio Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: app/codestudio-debug.keystore
          key: codestudio-android-debug-signing-v1

      - name: Create debug signing key if needed
        run: |
          if [ ! -f app/codestudio-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/codestudio-debug.keystore \
              -storepass CodeStudioDebug2026 \
              -alias codestudio \
              -keypass CodeStudioDebug2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CodeStudio Android, OU=Development, O=CodeStudio, C=BR"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CodeStudio-Editor-de-Codigo.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeStudio-Editor-de-Codigo
          path: app/build/outputs/apk/debug/CodeStudio-Editor-de-Codigo.apk
          if-no-files-found: error
          retention-days: 14
